services:
  httpbin:
    image: mccutchen/go-httpbin:2.26.0@sha256:873b4fdb27fe7cc66fa12cb9362574e1b0bf31df7ca8a71b2502988327a0b8a4
    command: [ "-port", "8081" ]
    ports:
      - 8081:8081

  caddy:
    depends_on:
      - httpbin
    build:
      context: ..
      dockerfile: ./e2e/Dockerfile
    environment:
      - HTTPBIN_HOST=httpbin
    ports:
      - 8080:8080
