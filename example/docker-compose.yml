services:
  httpbin:
    image: mccutchen/go-httpbin:2.26.0@sha256:873b4fdb27fe7cc66fa12cb9362574e1b0bf31df7ca8a71b2502988327a0b8a4
    environment:
      - MAX_BODY_SIZE=15728640 # 15 MiB
    command: [ "-port", "8081" ]
    ports:
      - 8081:8081

  caddy:
    depends_on:
      - httpbin
    build:
      context: ..
      dockerfile: ./example/Dockerfile
    volumes:
      - ./logs:/home/coraza/logs:rw
      - ./403.html:/etc/caddy/custom-pages/403.html:ro
    ports:
      - 8080:8080
    environment:
      - HTTPBIN_HOST=httpbin
